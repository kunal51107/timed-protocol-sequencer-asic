project:
  title: "Timed Protocol Sequencer"
  author: "Kunal"
  discord: ""
  description: "A host-reloadable, cycle-timed pin sequencer with a 128-word instruction store."
  language: "Verilog"
  clock_hz: 24000000
  tiles: "8x4"
  top_module: "tt_um_kunal_timed_protocol_sequencer"
  source_files:
    - "project.v"

pinout:
  ui[0]: "I0: protocol input"
  ui[1]: "I1: protocol input"
  ui[2]: "I2: protocol input"
  ui[3]: "I3: protocol input"
  ui[4]: "H_CS_N: host SPI select, active low"
  ui[5]: "H_SCK: host SPI clock"
  ui[6]: "H_MOSI: host SPI data into chip"
  ui[7]: "Host reserved: tie low"
  uo[0]: "O0: protocol output"
  uo[1]: "O1: protocol output"
  uo[2]: "O2: protocol output"
  uo[3]: "O3: protocol output"
  uo[4]: "H_MISO: host SPI data out, dedicated push-pull"
  uo[5]: "H_READY: host interface accepting frames"
  uo[6]: "H_BUSY: sequencer running or waiting"
  uo[7]: "H_IRQ: error pending or RX data available"
  uio[0]: "P0: protocol I/O; example UART data, SPI SCK, I2C SDA"
  uio[1]: "P1: protocol I/O; example SPI MOSI, I2C SCL"
  uio[2]: "P2: protocol I/O; example SPI MISO"
  uio[3]: "P3: protocol I/O; example SPI CS_N"
  uio[4]: "P4: protocol I/O"
  uio[5]: "P5: protocol I/O"
  uio[6]: "P6: protocol I/O"
  uio[7]: "P7: protocol I/O"

yaml_version: 6
